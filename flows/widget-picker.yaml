# The home menu's Widgets opens the picker; an app opens to sized entries. Nothing is added.
appId: dev.vulcanlauncher
tags: [edits]
---
- runFlow: common/fresh.yaml
- runFlow: common/home-menu.yaml
- tapOn: "(?i)widgets"
- assertVisible: "Widgets"
- tapOn: "Calendar"
- assertVisible: "(?s).*\\(\\d+×\\d+\\).*"   # "Analog  (2×1)\nClock"
- back
