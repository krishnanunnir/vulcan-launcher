# Locked layout: long-press on an icon offers no Remove; unlocking brings it back.
appId: dev.vulcanlauncher
tags: [edits]
---
- runFlow: common/fresh.yaml
- runFlow: common/settings.yaml
- tapOn: "Home screen"
- scrollUntilVisible: { element: { text: "Lock layout" }, direction: DOWN }
- tapOn: "Lock layout"
- back
- back
- longPressOn: "Gmail"
- assertNotVisible: "(?i)remove"
- back
- runFlow: common/settings.yaml
- tapOn: "Home screen"
- scrollUntilVisible: { element: { text: "Lock layout" }, direction: DOWN }
- tapOn: "Lock layout"
- back
- back
- longPressOn: "Gmail"
- assertVisible: "(?i)remove"
- back
