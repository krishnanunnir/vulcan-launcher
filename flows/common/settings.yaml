# Opens settings from the home icon (waits for its first section), retrying: a tap right after a (re)start can be ignored.
appId: dev.vulcanlauncher
---
- repeat:
    times: 3
    while:
      notVisible: "Home screen"
    commands:
      - tapOn: "Launcher settings"
      - waitForAnimationToEnd
- assertVisible: "Home screen"
