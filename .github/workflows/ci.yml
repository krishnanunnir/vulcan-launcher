# Tests, debug build and lint for every push to main and every pull request.
# pull_request (never pull_request_target): runs from forks get a read-only token and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      # JDK 21 matches F-Droid's build server (docs/BUILDING.md).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      # Hard rule (CLAUDE.md): no INTERNET or other network permission; docs/PERMISSIONS.md lists none.
      - name: No network permission
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          if grep -E "name='android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|CHANGE_WIFI_MULTICAST_STATE|NEARBY_WIFI_DEVICES)'" <<<"$perms"; then
            echo "::error::The APK requests a network permission"; exit 1
          fi
